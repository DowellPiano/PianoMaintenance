{% load static %}
<dialog id="qr-scanner" aria-labelledby="qr-scanner-title" aria-describedby="qr-scanner-status" data-decoder-url="{% static 'js/vendor/jsQR-1.4.0.js' %}">
  <h2 id="qr-scanner-title">Scan a piano QR code</h2>
  <p id="qr-scanner-status" role="status" aria-live="polite">Point your camera at the piano’s QR code.</p>
  <video id="qr-scanner-video" autoplay muted playsinline aria-label="Camera preview"></video>
  <div class="qr-scanner-actions">
    <button type="button" id="qr-scanner-retry" class="btn btn-primary" hidden>Try again</button>
    <button type="button" id="qr-scanner-close" class="btn btn-secondary" autofocus>Close</button>
  </div>
</dialog>
