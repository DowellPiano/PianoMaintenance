{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — Overtone</title>
  <link rel="icon" type="image/png" href="{% static 'img/overtone-icon.png' %}">
  <link rel="apple-touch-icon" href="{% static 'img/overtone-icon.png' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="auth-brand">
        <img src="{% static 'img/overtone-wordmark.png' %}" alt="Overtone" class="auth-brand-logo">
      </div>
      <p class="subtitle">Sign in to your account</p>

      {% if form.errors %}
        <div class="alert alert-error">Invalid username or password.</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label" for="id_username">Username</label>
          <input class="form-input" type="text" name="username" id="id_username" autofocus required>
        </div>
        <div class="form-group">
          <label class="form-label" for="id_password">Password</label>
          <input class="form-input" type="password" name="password" id="id_password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      </form>

      <p style="text-align:center; margin-top:.85rem; font-size:.88rem;">
        <a href="{% url 'password_reset' %}">Forgot your password?</a>
      </p>

      <p style="text-align:center; margin-top:1rem; font-size:.88rem;">
        Need access? Contact your company admin or Overtone support.
      </p>
    </div>
  </div>
</body>
</html>
