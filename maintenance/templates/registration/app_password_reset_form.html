{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — Piano Maintainer</title>
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1>Piano Maintainer</h1>
      <p class="subtitle">Reset your password</p>

      {% if form.errors %}
        <div class="alert alert-error">Enter a valid email address.</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label" for="id_email">Email</label>
          <input class="form-input" type="email" name="email" id="id_email" autocomplete="email" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Send Reset Link</button>
      </form>

      <p style="text-align:center; margin-top:1rem; font-size:.88rem;">
        Remembered it? <a href="{% url 'login' %}">Sign in</a>
      </p>
    </div>
  </div>
</body>
</html>
