{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Email Sent — Overtone</title>
  <link rel="icon" type="image/png" href="{% static 'img/overtone-icon.png' %}">
  <link rel="apple-touch-icon" href="{% static 'img/overtone-icon.png' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1>Overtone</h1>
      <p class="subtitle">Check your email</p>

      <p class="text-muted" style="line-height:1.5;">
        If an active account exists for that email address, a password reset link has been sent.
      </p>

      <p style="text-align:center; margin-top:1rem; font-size:.88rem;">
        <a href="{% url 'login' %}">Back to sign in</a>
      </p>
    </div>
  </div>
</body>
</html>
