{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Updated — Overtone</title>
  <link rel="icon" type="image/png" href="{% static 'img/overtone-icon.png' %}">
  <link rel="apple-touch-icon" href="{% static 'img/overtone-icon.png' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="auth-brand">
        <img src="{% static 'img/overtone-wordmark.png' %}" alt="Overtone" class="auth-brand-logo">
      </div>
      <h1>Password Updated</h1>
      <p class="subtitle">Your password has been changed.</p>
      <a href="{% url 'login' %}" class="btn btn-primary" style="width:100%; display:block; text-align:center;">Return to Sign In</a>
    </div>
  </div>
</body>
</html>
