{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose Password — Overtone</title>
  <link rel="icon" type="image/png" href="{% static 'img/overtone-icon.png' %}">
  <link rel="apple-touch-icon" href="{% static 'img/overtone-icon.png' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1>Overtone</h1>
      <p class="subtitle">Choose a new password.</p>
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label" for="id_new_password1">New Password</label>
          <input class="form-input" type="password" name="new_password1" id="id_new_password1" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="id_new_password2">Confirm Password</label>
          <input class="form-input" type="password" name="new_password2" id="id_new_password2" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Save Password</button>
      </form>
    </div>
  </div>
  <script src="{% static 'js/form-submit-lock.js' %}"></script>
</body>
</html>
