<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report an Issue — {{ piano.name }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f4f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,.10);
      padding: 2rem;
      width: 100%;
      max-width: 480px;
    }
    h1 { font-size: 1.4rem; margin-bottom: .25rem; color: #18181b; }
    .sub { color: #71717a; font-size: .9rem; margin-bottom: 1.75rem; }
    label { display: block; font-size: .875rem; font-weight: 600;
            color: #3f3f46; margin-bottom: .35rem; }
    input, textarea {
      display: block; width: 100%;
      border: 1px solid #d4d4d8; border-radius: 8px;
      padding: .6rem .75rem; font-size: 1rem; color: #18181b;
      margin-bottom: 1.25rem;
      transition: border-color .15s;
    }
    input:focus, textarea:focus {
      outline: none; border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.15);
    }
    textarea { resize: vertical; min-height: 110px; }
    .optional { font-weight: 400; color: #a1a1aa; font-size: .8rem; }
    button {
      width: 100%; padding: .75rem;
      background: #6366f1; color: #fff;
      border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Report an Issue</h1>
    <p class="sub">{{ piano.make }} {{ piano.model }} — {{ piano.name }}</p>

    <form method="post">
      {% csrf_token %}

      <label for="issue_description">Issue Description <span style="color:#ef4444">*</span></label>
      <textarea id="issue_description" name="issue_description"
                placeholder="Describe the problem…" required></textarea>

      <label for="reported_by_name">Your Name <span class="optional">(optional)</span></label>
      <input type="text" id="reported_by_name" name="reported_by_name"
             placeholder="Jane Smith" />

      <label for="reported_by_email">Your Email <span class="optional">(optional)</span></label>
      <input type="email" id="reported_by_email" name="reported_by_email"
             placeholder="jane@example.com" />

      <button type="submit">Submit Request</button>
    </form>
  </div>
</body>
</html>
