<div class="form-group work-timer" data-work-timer data-hours-input-id="id_hours_worked">
  <label class="form-label">Work Timer</label>
  <div class="work-timer-panel" aria-live="polite">
    <div class="work-timer-summary">
      <output class="work-timer-elapsed" data-work-timer-elapsed>00:00:00</output>
      <div class="work-timer-times">
        <span>Start: <strong data-work-timer-start-time>--</strong></span>
        <span>End: <strong data-work-timer-end-time>--</strong></span>
      </div>
    </div>
    <div class="work-timer-actions">
      <button type="button" class="btn btn-sm btn-primary" data-work-timer-start>Start</button>
      <button type="button" class="btn btn-sm btn-secondary" data-work-timer-end disabled>End</button>
      <button type="button" class="btn btn-sm btn-secondary" data-work-timer-reset disabled>Reset</button>
    </div>
  </div>
</div>
