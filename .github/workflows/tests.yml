name: Django tests

on:
  push:
    branches:
      - SaaS
  pull_request:
    branches:
      - SaaS
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: django-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-only-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost
      DATABASE_URL: sqlite:////tmp/overtone-ci.sqlite3
      DATABASE_CONN_MAX_AGE: "0"
      DATABASE_SSL_REQUIRE: "False"
      MEDIA_ROOT: /tmp/overtone-media
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      EMAIL_NOTIFICATIONS_ENABLED: "False"
      DEFAULT_FROM_EMAIL: ci@example.invalid
      RESEND_API_KEY: ""
      SENTRY_ENABLED: "False"
      SENTRY_DSN: ""
      SUPABASE_S3_REQUIRED: "False"
      SUPABASE_S3_ACCESS_KEY_ID: ""
      SUPABASE_S3_SECRET_ACCESS_KEY: ""
      SUPABASE_S3_BUCKET: ""
      SUPABASE_S3_ENDPOINT: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite
        run: python manage.py test maintenance
